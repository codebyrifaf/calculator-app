name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install project dependencies
        run: npm ci

      - name: Run unit tests
        run: npx jest Tests/basic.test.js Tests/advanced.test.js Tests/custom.test.js

      - name: Run integration tests
        run: npx jest Tests/integration.test.js Tests/stub.test.js Tests/driver.test.js

      - name: Run the full test suite
        run: npm test